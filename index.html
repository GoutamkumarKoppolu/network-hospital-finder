<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official network hospital locators, IRDAI claim and complaint figures, and news for 12 Indian health insurers, including Star Health and Care. Free, unofficial." />
    <meta name="theme-color" content="#0e7490" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7490'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Network Hospital Finder for Indian Health Insurers</title>
    <link rel="canonical" href="https://goutamkumarkoppolu.github.io/network-hospital-finder/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goutamkumarkoppolu.github.io/network-hospital-finder/" />
    <meta property="og:title" content="Network Hospital Finder" />
    <meta property="og:description" content="Official network hospital locators, IRDAI claim and complaint figures, and news for 12 Indian health insurers, including Star Health and Care. Free, unofficial." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <!--json-ld-->
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#fff" fill-opacity=".18"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"/></svg>
          <h1 data-s="title"></h1>
        </div>
        <p class="lead" data-s="lead"></p>
        <p class="tagline" data-s="tagline"></p>
      </div>
    </header>

    <main class="wrap">
      <form id="search-form" class="search-card" novalidate>
        <div class="field">
          <label for="insurer" data-s="insurerLabel"></label>
          <select id="insurer" name="insurer"><option value="" data-s="choose"></option></select>
        </div>
        <button type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span data-s="search"></span>
        </button>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <ol id="intro" class="steps">
        <li><span class="num">1</span><span data-s="step1"></span></li>
        <li><span class="num">2</span><span data-s="step2"></span></li>
        <li><span class="num">3</span><span data-s="step3"></span></li>
      </ol>

      <section class="panel faq" aria-labelledby="faq-heading">
        <h2 id="faq-heading" data-s="faqHeading"></h2>
        <div id="faq-list"></div>
      </section>

      <section id="hospitals" class="panel" aria-labelledby="hospitals-heading" hidden>
        <h2 id="hospitals-heading" class="h-hospital" data-s="hospitalsHeading"></h2>
        <p class="note" data-s="shortDisclaimer"></p>
        <p id="hospital-status" class="status" aria-live="polite"></p>
        <a id="locator" class="locator" target="_blank" rel="noopener noreferrer" hidden></a>
      </section>

      <section id="about" class="panel" aria-labelledby="about-heading" hidden>
        <h2 id="about-heading" class="h-shield"></h2>
        <div id="about-body"></div>
      </section>

      <section id="news" class="panel" aria-labelledby="news-heading" hidden>
        <h2 id="news-heading" class="h-news"></h2>
        <p class="note" data-s="newsNote"></p>
        <p id="news-status" class="status" aria-live="polite"></p>
        <div id="news-list"></div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <h2 class="h-shield" data-s="disclaimerHeading"></h2>
        <ul id="disclaimers"></ul>
        <p class="contact"><!--updated--></p>
        <p class="contact">
          <span data-s="contact"></span>
          <a href="mailto:vibecodergk@gmail.com?subject=Network%20Hospital%20Finder">vibecodergk@gmail.com</a>
          · <a href="https://github.com/GoutamkumarKoppolu/network-hospital-finder/issues" target="_blank" rel="noopener noreferrer" data-s="contactGithub"></a>
        </p>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
    <!-- Search state lives in the #hash, which browsers never send to any server (a pincode hints at location).
         Old ?insurer=…&pincode=… links are moved to the hash. -->
    <script>if (location.search) history.replaceState(null, "", location.pathname + "#" + location.search.slice(1));</script>
    <!-- Firebase Analytics (requirement 3.8) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YVWM5DM3TZ"></script>
    <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag("js", new Date()); gtag("config", "G-YVWM5DM3TZ");</script>
  </body>
</html>
