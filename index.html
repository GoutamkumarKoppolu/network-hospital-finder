<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find cashless network hospitals by pincode for Care Health, Niva Bupa and Star Health, plus recent news headlines about each insurer. Free, unofficial information." />
    <title>Network Hospital Finder</title>
  </head>
  <body>
    <header>
      <h1 data-s="title"></h1>
      <p data-s="tagline"></p>
    </header>
    <main>
      <form id="search-form" novalidate>
        <div class="field">
          <label for="insurer" data-s="insurerLabel"></label>
          <select id="insurer" name="insurer"><option value="" data-s="choose"></option></select>
        </div>
        <div class="field">
          <label for="pincode" data-s="pincodeLabel"></label>
          <input id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="500001" />
        </div>
        <button type="submit" data-s="search"></button>
      </form>
      <p id="form-error" class="error" role="alert"></p>

      <section id="hospitals" aria-labelledby="hospitals-heading" hidden>
        <h2 id="hospitals-heading" data-s="hospitalsHeading"></h2>
        <p class="note" data-s="shortDisclaimer"></p>
        <p><a id="source" class="meta" target="_blank" rel="noopener noreferrer nofollow" hidden></a></p>
        <p id="hospital-status" aria-live="polite"></p>
        <ul id="hospital-list" class="cards"></ul>
        <button id="show-more" type="button" data-s="showMore" hidden></button>
      </section>

      <section id="news" aria-labelledby="news-heading" hidden>
        <h2 id="news-heading"></h2>
        <p id="news-status" aria-live="polite"></p>
        <ul id="news-list" class="news"></ul>
      </section>
    </main>
    <footer>
      <ul id="disclaimers"></ul>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
